name: Build and Push Docker Image

on:
  push:
    tags:
      - '*'

jobs:
  docker:
    uses: mconf/mconf-ci-jobs/.github/workflows/lb-push-scan-image.yml@main
    # Optional inputs:
    # build-args: Additional Docker build arguments
    # image-suffix: Suffix to append to the image tag
    # runs-on: Custom runner configuration (JSON array format)
    # scan_enabled: true # Run Trivy on non-tag refs too; tag refs are always scanned because they push to Docker Hub, which Harbor does not scan (default: false)
    # trivy-debug: true # Enable Trivy debug output to diagnose slow or failing scans (default: true)
    secrets: inherit
    # Required secrets:
    # REGISTRY_ACCESS_TOKEN: DockerHub access token
    # TRIVY_EXPLORER_AUTH_TOKEN: Authentication token for Trivy Explorer (used on tag refs, or when scan_enabled is true)
    # TRIVY_EXPLORER_URL: URL endpoint for Trivy Explorer (used on tag refs, or when scan_enabled is true)
    # Optional secrets:
    # SSH_PRIVATE_KEY: For accessing private Git repositories during build
    # PRODUCER_SSH_PRIVATE_KEY: For accessing producer-related private Git repositories during build
