name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    uses: mconf/mconf-ci-jobs/.github/workflows/lb-go-tests.yml@main
    with:
      # go-version (required): Go version to use
      go-version: "1.21"
    # Optional secrets, used when present:
    #   DOCKERHUB_USERNAME / DOCKERHUB_PASSWORD: authenticate image pulls, so tests
    #     that start containers are not blocked by Docker Hub's anonymous rate limit
    #   SSH_PRIVATE_KEY / PRODUCER_SSH_PRIVATE_KEY: access private Go modules
    secrets: inherit

