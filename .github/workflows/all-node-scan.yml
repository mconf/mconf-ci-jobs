name: Run Node scan

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      node-version-file:
        description: 'File to read the Node version from'
        type: string
        required: false
        default: '.node-version'
      audit-level:
        description: 'Lowest severity that fails the job'
        type: string
        required: false
        default: 'high'
      runs-on:
        type: string
        required: false
        default: '["self-hosted", "ubuntu-22.04"]'

permissions:
  contents: read

jobs:
  scan:
    name: npm audit
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ${{ inputs.node-version-file }}

      # `npm audit` reads the lockfile; the dependencies do not need installing.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=${{ inputs.audit-level }}
