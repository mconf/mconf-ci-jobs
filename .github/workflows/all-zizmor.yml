name: Audit GitHub Actions workflows (zizmor)

on:
  # Audits this repository's own workflows; callers only trigger workflow_call
  pull_request:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: false
        default: '["self-hosted", "latest"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}-zizmor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    # Own PRs (public repo, fork PRs) never reach the self-hosted runner
    runs-on: ${{ fromJSON(inputs.runs-on || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Self-hosted runners have python3 without pip, which the zizmor action needs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # Fails the job only on high severity, as the card policy asks
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          min-severity: high

      # Reruns the binary the action downloaded and verified, without exit codes,
      # so lower findings show up without a red "exit code" annotation
      - name: Report all findings
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor=$(ls "$RUNNER_TEMP"/zizmor-wheel/unpacked/zizmor-*.data/scripts/zizmor 2>/dev/null | head -1)
          if [ ! -x "$zizmor" ]; then
            echo "::warning::zizmor binary not found in the action's folder, skipping the full report"
            exit 0
          fi
          "$zizmor" --format=github --no-exit-codes --color=never . > "$RUNNER_TEMP/zizmor-all"
          # High findings were already annotated by the action
          grep -v '^::error file=' "$RUNNER_TEMP/zizmor-all" || true
          grep -q '^::[a-z]* file=' "$RUNNER_TEMP/zizmor-all" || exit 0
          {
            echo '| Level | Rule | File | Line | Finding |'
            echo '|---|---|---|---|---|'
            sed -n 's/^::\([a-z]*\) file=\([^,]*\),line=\([0-9]*\),title=\([^:]*\)::[^:]*:[0-9]*: \(.*\)$/| \1 | `\4` | `\2` | \3 | \5 |/p' "$RUNNER_TEMP/zizmor-all"
          } >> "$GITHUB_STEP_SUMMARY"
