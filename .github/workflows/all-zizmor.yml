name: Audit GitHub Actions workflows (zizmor)

on:
  # Audits this repository's own workflows; callers only trigger workflow_call
  pull_request:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: false
        default: '["self-hosted", "latest"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}-zizmor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    # Own PRs (public repo, fork PRs) never reach the self-hosted runner
    runs-on: ${{ fromJSON(inputs.runs-on || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Reports every severity as annotations; zizmor exits non-zero on any
      # finding, so the last step decides the job (high = ::error)
      - name: Run zizmor
        id: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        continue-on-error: true
        with:
          advanced-security: false
          annotations: true

      # GitHub caps annotations per step; the action keeps the full output here
      - name: List findings in the job summary
        run: |
          grep -q '^::[a-z]* file=' "$RUNNER_TEMP/zizmor" 2>/dev/null || exit 0
          {
            echo '| Level | Rule | File | Line | Finding |'
            echo '|---|---|---|---|---|'
            sed -n 's/^::\([a-z]*\) file=\([^,]*\),line=\([0-9]*\),title=\([^:]*\)::[^:]*:[0-9]*: \(.*\)$/| \1 | `\4` | `\2` | \3 | \5 |/p' "$RUNNER_TEMP/zizmor"
          } >> "$GITHUB_STEP_SUMMARY"

      # A failed run with no findings means zizmor itself broke, not a pass
      - name: Fail on high-severity findings
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          if grep -q '^::error file=' "$RUNNER_TEMP/zizmor" 2>/dev/null; then
            echo "High-severity findings, see the annotations and the job summary"
            exit 1
          fi
          if [ "$ZIZMOR_OUTCOME" = failure ] && ! grep -q '^::[a-z]* file=' "$RUNNER_TEMP/zizmor" 2>/dev/null; then
            echo "zizmor failed without reporting findings, see the Run zizmor step"
            exit 1
          fi
