name: Run Ruby lint

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}-lint
  cancel-in-progress: true

jobs:
  lint:  # zizmor: ignore[excessive-permissions]
    name: RuboCop
    runs-on: [self-hosted, latest]
    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            build-essential git libmariadb-dev libsqlite3-dev libyaml-dev pkg-config
      - name: Checkout code  # zizmor: ignore[artipacked]
        uses: actions/checkout@v5  # zizmor: ignore[unpinned-uses]
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1  # zizmor: ignore[unpinned-uses]
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Lint Ruby code for syntax errors and bugs
        # -l runs a lint check only, -f github formats the output for GitHub
        run: bundle exec rubocop -l -f github --config .rubocop.yml
      - name: Lint HAML files
        run: bundle exec haml-lint -c .haml-lint.yml app/views
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0  # zizmor: ignore[unpinned-uses]
        with:
          dockerfile: Dockerfile
