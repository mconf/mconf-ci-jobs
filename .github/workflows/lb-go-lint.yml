name: Run lint
on:
  workflow_call:
    inputs:
      go-version:
        type: string
        required: true
      golangci-lint-version:
        type: string
        required: true
env:
  GOPRIVATE: github.com/mconf/*
permissions:
  contents: read
jobs:
  lint:
    name: Run lint
    runs-on: [self-hosted, latest]
    timeout-minutes: 15
    steps:
      - name: zizmor test, do not merge
        uses: actions/checkout@v4
      - name: Check out Source Repository  # zizmor: ignore[artipacked]
        uses: actions/checkout@v6  # zizmor: ignore[unpinned-uses]

      - name: Set up Go
        uses: actions/setup-go@v6  # zizmor: ignore[unpinned-uses]
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Install SSH Agent
        if: ${{ env.ssh-private-key != '' }}
        env:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Configure Git to Access Private Modules
        if: ${{ env.ssh-private-key != '' }}
        env:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        uses: webfactory/ssh-agent@v0.5.4  # zizmor: ignore[unpinned-uses]
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}
            ${{ secrets.PRODUCER_SSH_PRIVATE_KEY }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0  # zizmor: ignore[unpinned-uses]
        with:
          version: ${{ inputs.golangci-lint-version }}
          args: --timeout=10m
