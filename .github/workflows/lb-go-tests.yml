name: Run tests
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      go-version:
        type: string
        required: true
permissions:
  pull-requests: write
  contents: read
env:
  GOPRIVATE: "github.com/mconf/*"
jobs:
  tests:
    name: Run tests
    runs-on: [self-hosted, latest]
    timeout-minutes: 15
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Check out Source Repository  # zizmor: ignore[artipacked]
        uses: actions/checkout@v6  # zizmor: ignore[unpinned-uses]

      - name: Get Modified Go Files
        id: changed-go-files
        uses: tj-actions/changed-files@v47  # zizmor: ignore[unpinned-uses]
        with:
          files: |
            **/*.go
            go.mod
            go.sum

      - name: Set up Go
        if: steps.changed-go-files.outputs.any_changed == 'true'
        uses: actions/setup-go@v6  # zizmor: ignore[unpinned-uses]
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Install SSH Agent
        if: ${{ steps.changed-go-files.outputs.any_changed == 'true' && env.ssh-private-key != '' }}
        env:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Configure Git to Access Private Modules
        if: ${{ steps.changed-go-files.outputs.any_changed == 'true' && env.ssh-private-key != '' }}
        env:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        uses: webfactory/ssh-agent@v0.5.4  # zizmor: ignore[unpinned-uses]
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}
            ${{ secrets.PRODUCER_SSH_PRIVATE_KEY }}

      - name: Install Gocov
        if: steps.changed-go-files.outputs.any_changed == 'true'
        run: go install github.com/axw/gocov/gocov@v1.1.0

      - name: Install Gocov-XML
        if: steps.changed-go-files.outputs.any_changed == 'true'
        run: go install github.com/AlekSi/gocov-xml@v1.1.0

      # Unauthenticated pulls share the self-hosted runner's IP and hit Docker
      # Hub's rate limit, which testcontainers surfaces as "pull access denied".
      - name: Login to DockerHub
        if: ${{ steps.changed-go-files.outputs.any_changed == 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_PASSWORD != '' }}
        uses: docker/login-action@v3  # zizmor: ignore[unpinned-uses]
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Test and Generate Coverage File
        if: steps.changed-go-files.outputs.any_changed == 'true'
        run: | # Get coverage only for packages that have tests.
          packages=$(find . -name '*_test.go' -exec dirname {} + | sort -u | tr '\n' ',' | sed 's/,$//')
          gocov test ./... -coverpkg $packages | gocov-xml > coverage.cobertura.xml
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Generate Code Coverage Summary Report
        if: steps.changed-go-files.outputs.any_changed == 'true'
        uses: irongut/CodeCoverageSummary@v1.3.0  # zizmor: ignore[unpinned-uses]
        with:
          filename: coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "50 75"

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2  # zizmor: ignore[unpinned-uses]
        if: ${{ steps.changed-go-files.outputs.any_changed == 'true' && github.event_name == 'pull_request' }}
        with:
          recreate: true
          path: code-coverage-results.md
