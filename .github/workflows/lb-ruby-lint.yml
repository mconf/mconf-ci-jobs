name: Run lint
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ruby-version:
        type: string
        required: true
      extra-packages:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  Lint:
    name: Run lint
    runs-on: [self-hosted, latest]
    timeout-minutes: 15
    steps:
    - name: Check out Source Repository  # zizmor: ignore[artipacked]
      uses: actions/checkout@v6  # zizmor: ignore[unpinned-uses]
    - name: Install Tools
      run: |  # zizmor: ignore[template-injection]
        sudo apt-get update
        sudo apt-get install -y build-essential patch ruby-dev zlib1g-dev liblzma-dev libgmp-dev libpq-dev libsqlite3-dev ${{ inputs.extra-packages }}
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1  # zizmor: ignore[unpinned-uses]
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true
    - name: Install Dependencies
      run: bundle install
    - name: Run RuboCop Linter
      run: bundle exec rubocop -l
